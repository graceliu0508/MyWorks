<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>航海王熱血大數字倒數計時器</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti for Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts: Fredoka & Zen Maru Gothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Zen Maru Gothic', 'Fredoka', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* 超大數字專屬字型與主題陰影 */
    .timer-display {
      font-family: 'Fredoka', 'Zen Maru Gothic', sans-serif;
      font-variant-numeric: tabular-nums;
      line-height: 0.95;
    }

    /* 風格 1：經典草帽海賊 (熱血金紅) */
    body.theme-strawhat {
      background: linear-gradient(to bottom, #1e3a8a, #1e40af, #0284c7);
      color: #fef3c7;
    }
    body.theme-strawhat .timer-display {
      text-shadow: 0 8px 0px rgba(180, 83, 9, 0.4), 0 16px 30px rgba(217, 119, 6, 0.25);
    }

    /* 風格 2：新世界深海 (神秘極光藍綠) */
    body.theme-deepsea {
      background: linear-gradient(to bottom, #064e3b, #0f766e, #0e7490);
      color: #ccfbf1;
    }
    body.theme-deepsea .timer-display {
      text-shadow: 0 8px 0px rgba(13, 148, 136, 0.4), 0 16px 30px rgba(20, 184, 166, 0.25);
    }

    /* 風格 3：冒險航海羅盤 (復古古銅木質金) */
    body.theme-compass {
      background: linear-gradient(to bottom, #451a03, #78350f, #92400e);
      color: #fef3c7;
    }
    body.theme-compass .timer-display {
      text-shadow: 0 8px 0px rgba(120, 53, 15, 0.6), 0 16px 30px rgba(180, 83, 9, 0.4);
    }

    /* 雲朵緩慢飄浮動畫 */
    @keyframes floatCloud {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-10px) translateX(15px); }
    }
    .floating-cloud-1 { animation: floatCloud 8s ease-in-out infinite; }
    .floating-cloud-2 { animation: floatCloud 10s ease-in-out infinite 2s; }

    /* 橡膠果實彈跳特效按鈕 */
    .jelly-btn {
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 6px 0px var(--btn-shadow, #b45309);
    }
    .jelly-btn:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0px var(--btn-shadow, #b45309);
    }

    /* 進度條平滑過渡 */
    .progress-fill {
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 隱藏數字輸入器預設箭頭 */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="theme-strawhat min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 relative overflow-x-hidden">

  <!-- 背景海洋與航海風裝飾 -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden z-0 opacity-30">
    <div class="absolute top-12 left-[10%] floating-cloud-1">
      <svg class="w-32 h-16 text-white fill-current" viewBox="0 0 100 60">
        <path d="M20,45 A15,15 0 0,1 35,25 A22,22 0 0,1 70,25 A15,15 0 0,1 85,45 A10,10 0 0,1 20,45 Z" />
      </svg>
    </div>
    <div class="absolute top-28 right-[12%] floating-cloud-2">
      <svg class="w-40 h-20 text-white fill-current" viewBox="0 0 100 60">
        <path d="M20,45 A15,15 0 0,1 35,25 A22,22 0 0,1 70,25 A15,15 0 0,1 85,45 A10,10 0 0,1 20,45 Z" />
      </svg>
    </div>
    <div class="absolute top-16 left-1/3 text-amber-100/60 text-xl">〰️</div>
    <div class="absolute top-24 right-1/3 text-amber-100/60 text-lg">〰️</div>
  </div>

  <!-- 頂部功能列：標題、全螢幕、齒輪設定按鈕 -->
  <header class="w-full max-w-3xl flex justify-between items-center relative z-10 pt-2">
    <!-- 品牌 / 標題 -->
    <div class="flex items-center space-x-2.5">
      <div class="w-9 h-9 sm:w-10 sm:h-10 bg-amber-500 rounded-full flex items-center justify-center text-blue-950 font-black shadow-md border-2 border-amber-200">
        ⚓
      </div>
      <h1 class="text-xl sm:text-2xl font-black tracking-wider text-amber-300 drop-shadow">偉大航道計時器</h1>
    </div>

    <!-- 控制按鈕區 (全螢幕、齒輪設定) -->
    <div class="flex items-center space-x-2 sm:space-x-3">
      <!-- 全螢幕切換 -->
      <button id="fullscreenBtn" class="p-2.5 sm:p-3 rounded-2xl bg-white/10 hover:bg-white/20 text-amber-200 shadow-sm transition border border-amber-400/30 flex items-center justify-center text-lg active:scale-95 backdrop-blur-sm" title="全螢幕模式">
        ⛶
      </button>
      <!-- 齒輪設定彈窗按鈕 (整合所有參數與風格) -->
      <button id="openModalBtn" class="p-2.5 sm:p-3 rounded-2xl bg-amber-500 hover:bg-amber-600 text-blue-950 font-black shadow-lg transition border-2 border-amber-200 active:scale-95 flex items-center justify-center text-xl" title="航海設定與風格">
        ⚙️
      </button>
    </div>
  </header>

  <!-- 主體核心區：標誌、超大數字、進度條 -->
  <main class="w-full max-w-4xl flex-1 flex flex-col justify-center items-center my-3 sm:my-6 relative z-10 text-center">
    
    <!-- 航海風圖示標誌 -->
    <div id="mascot" class="mb-4 sm:mb-6 transition-transform cursor-pointer relative group" title="點擊轉動船舵！">
      <div class="relative w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-tr from-amber-500 to-yellow-400 rounded-full shadow-xl flex items-center justify-center border-4 border-amber-200 transform transition-transform group-hover:scale-105">
        <span class="text-3xl sm:text-4xl filter drop-shadow">👒</span>
      </div>
      <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 bg-amber-400 text-blue-950 text-[11px] font-black px-2.5 py-0.5 rounded-full shadow border border-amber-200 uppercase tracking-widest">
        ONE PIECE
      </div>
    </div>

    <!-- 超大倒數數字顯示器 -->
    <div class="w-full px-2">
      <div id="timerText" class="timer-display text-amber-300 text-[18vw] sm:text-[16vw] md:text-[140px] lg:text-[165px] font-black tracking-tight transition-all duration-200">
        25:00
      </div>
    </div>

    <!-- 航海風進度條 -->
    <div class="w-11/12 max-w-xl bg-blue-950/60 backdrop-blur-md rounded-full h-4 sm:h-5 p-1 mt-2 mb-6 sm:mb-8 shadow-inner border border-amber-400/40 overflow-hidden">
      <div id="progressBar" class="progress-fill h-full bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-300 rounded-full w-full shadow-md"></div>
    </div>

    <!-- 主要操作控制按鈕 (開始/暫停、重設) -->
    <div class="flex items-center justify-center gap-4 sm:gap-6 w-full max-w-md">
      <!-- 重設按鈕 -->
      <button id="resetBtn" style="--btn-shadow: #1e3a8a;" class="jelly-btn flex-1 py-3.5 sm:py-4 px-6 rounded-3xl bg-blue-900/80 hover:bg-blue-900 text-amber-200 font-bold text-lg sm:text-xl border-2 border-amber-400/30 flex items-center justify-center gap-2 backdrop-blur-sm">
        <span>🔄</span>
        <span>重設</span>
      </button>

      <!-- 開始/暫停按鈕 -->
      <button id="startBtn" style="--btn-shadow: #b45309;" class="jelly-btn flex-[1.6] py-3.5 sm:py-4 px-8 rounded-3xl bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-blue-950 font-black text-xl sm:text-2xl shadow-xl border-2 border-amber-200 flex items-center justify-center gap-2.5">
        <span id="startIcon">▶</span>
        <span id="startText">起航出發</span>
      </button>
    </div>

    <!-- 常用時間快速點選 -->
    <div class="mt-6 sm:mt-8 flex flex-wrap justify-center gap-2 sm:gap-3 max-w-lg">
      <button class="preset-btn px-3.5 py-1.5 sm:px-4 sm:py-2 bg-white/10 hover:bg-white/20 text-amber-200 font-bold text-sm sm:text-base rounded-2xl shadow-sm border border-amber-400/30 transition active:scale-95 backdrop-blur-sm" data-sec="60">1 分鐘</button>
      <button class="preset-btn px-3.5 py-1.5 sm:px-4 sm:py-2 bg-white/10 hover:bg-white/20 text-amber-200 font-bold text-sm sm:text-base rounded-2xl shadow-sm border border-amber-400/30 transition active:scale-95 backdrop-blur-sm" data-sec="300">5 分鐘</button>
      <button class="preset-btn px-3.5 py-1.5 sm:px-4 sm:py-2 bg-white/10 hover:bg-white/20 text-amber-200 font-bold text-sm sm:text-base rounded-2xl shadow-sm border border-amber-400/30 transition active:scale-95 backdrop-blur-sm" data-sec="600">10 分鐘</button>
      <button class="preset-btn px-3.5 py-1.5 sm:px-4 sm:py-2 bg-amber-500 hover:bg-amber-600 text-blue-950 font-black text-sm sm:text-base rounded-2xl shadow-md border border-amber-200 transition active:scale-95" data-sec="1500">🍖 25 分 (航海專注)</button>
    </div>
  </main>

  <!-- 底部微暖提示 -->
  <footer class="relative z-10 text-xs sm:text-sm text-amber-200/70 pb-2 flex items-center gap-1.5 font-bold tracking-wide">
    <span>⚓ 乘風破浪，朝著夢想的目標前進！</span>
  </footer>

  <!-- 齒輪設定彈出視窗 (Modal)：整合參數、音效與三種風格選擇 -->
  <div id="customModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
    <div class="bg-blue-950 border-4 border-amber-400 rounded-[32px] p-6 sm:p-8 max-w-md w-full shadow-2xl transform scale-95 transition-transform duration-200 text-amber-50">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-black text-amber-300">⚙️ 航海設定與風格</h3>
        <button id="closeModalX" class="text-amber-200 hover:text-white text-xl font-bold px-2">✕</button>
      </div>

      <!-- 1. 自訂時間區塊 -->
      <div class="mb-5 bg-blue-900/60 p-4 rounded-2xl border border-amber-400/30">
        <label class="block text-xs font-bold text-amber-300 mb-2 uppercase tracking-wider">自訂冒險時長</label>
        <div class="flex items-center justify-center gap-2">
          <!-- 時 -->
          <div class="flex flex-col items-center">
            <input type="number" id="inputHours" min="0" max="99" value="0" class="w-16 h-14 text-center text-xl font-black bg-blue-900 rounded-xl border-2 border-amber-400/50 focus:border-amber-400 focus:outline-none text-amber-200">
            <span class="text-[11px] font-bold text-amber-300 mt-1">時</span>
          </div>
          <span class="text-2xl font-bold text-amber-400 pb-4">:</span>
          <!-- 分 -->
          <div class="flex flex-col items-center">
            <input type="number" id="inputMinutes" min="0" max="59" value="25" class="w-16 h-14 text-center text-xl font-black bg-blue-900 rounded-xl border-2 border-amber-400/50 focus:border-amber-400 focus:outline-none text-amber-200">
            <span class="text-[11px] font-bold text-amber-300 mt-1">分</span>
          </div>
          <span class="text-2xl font-bold text-amber-400 pb-4">:</span>
          <!-- 秒 -->
          <div class="flex flex-col items-center">
            <input type="number" id="inputSeconds" min="0" max="59" value="0" class="w-16 h-14 text-center text-xl font-black bg-blue-900 rounded-xl border-2 border-amber-400/50 focus:border-amber-400 focus:outline-none text-amber-200">
            <span class="text-[11px] font-bold text-amber-300 mt-1">秒</span>
          </div>
        </div>
      </div>

      <!-- 2. 音效開關設定 -->
      <div class="mb-5 bg-blue-900/60 p-4 rounded-2xl border border-amber-400/30 flex justify-between items-center">
        <div>
          <div class="font-bold text-amber-200 text-sm">提示音效</div>
          <div class="text-xs text-amber-200/60">倒數尾聲與完成時播放提示音</div>
        </div>
        <button id="soundToggleBtn" class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-blue-950 font-black text-sm shadow transition flex items-center gap-1.5">
          <span id="soundIcon">🔔</span>
          <span id="soundText">已開啟</span>
        </button>
      </div>

      <!-- 3. 三種視覺風格與配色選擇 -->
      <div class="mb-6 bg-blue-900/60 p-4 rounded-2xl border border-amber-400/30">
        <div class="font-bold text-amber-200 text-sm mb-2.5">視覺風格與配色</div>
        <div class="grid grid-cols-3 gap-2">
          <button class="theme-option-btn p-2.5 rounded-xl border-2 border-amber-400/40 bg-gradient-to-b from-blue-600 to-blue-800 text-amber-200 font-bold text-xs transition active:scale-95 flex flex-col items-center gap-1" data-theme="theme-strawhat">
            <span>👒</span>
            <span>經典草帽</span>
          </button>
          <button class="theme-option-btn p-2.5 rounded-xl border-2 border-transparent bg-gradient-to-b from-emerald-700 to-teal-900 text-emerald-200 font-bold text-xs transition active:scale-95 flex flex-col items-center gap-1" data-theme="theme-deepsea">
            <span>🌊</span>
            <span>新世界深海</span>
          </button>
          <button class="theme-option-btn p-2.5 rounded-xl border-2 border-transparent bg-gradient-to-b from-amber-900 to-yellow-950 text-amber-200 font-bold text-xs transition active:scale-95 flex flex-col items-center gap-1" data-theme="theme-compass">
            <span>🧭</span>
            <span>冒險羅盤</span>
          </button>
        </div>
      </div>

      <!-- 儲存與確認按鈕 -->
      <div class="flex gap-3">
        <button id="cancelModalBtn" class="flex-1 py-3 bg-blue-900 hover:bg-blue-800 text-amber-200 font-bold rounded-2xl transition border border-amber-400/20">取消</button>
        <button id="saveModalBtn" class="flex-1 py-3 bg-amber-500 hover:bg-amber-600 text-blue-950 font-black rounded-2xl shadow-md transition">套用設定</button>
      </div>
    </div>
  </div>

  <!-- 計時完成祝賀彈窗 -->
  <div id="finishModal" class="fixed inset-0 bg-blue-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
    <div class="bg-blue-900 border-4 border-amber-400 rounded-[36px] p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl transform scale-95 transition-transform duration-300 text-amber-50">
      <div class="text-5xl sm:text-6xl mb-3 animate-bounce">🏆</div>
      <h2 class="text-2xl sm:text-3xl font-black text-amber-300 mb-2">航海大成功！</h2>
      <p class="text-amber-100 text-sm mb-6">太厲害了！你成功完成了這趟航行，找到了屬於你的大祕寶！✨</p>
      <button id="closeFinishBtn" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-600 hover:to-yellow-500 text-blue-950 font-black text-lg rounded-2xl shadow-xl transition active:scale-95 border border-amber-200">
        繼續冒險 (知道了)
      </button>
    </div>
  </div>

  <!-- JavaScript 核心邏輯 -->
  <script>
    // --- 狀態管理 ---
    let totalSeconds = 1500;
    let remainingSeconds = 1500;
    let timerId = null;
    let isRunning = false;
    let isSoundEnabled = true;
    let currentTheme = 'theme-strawhat';

    // --- DOM 元素引用 ---
    const timerText = document.getElementById('timerText');
    const progressBar = document.getElementById('progressBar');
    const startBtn = document.getElementById('startBtn');
    const startText = document.getElementById('startText');
    const startIcon = document.getElementById('startIcon');
    const resetBtn = document.getElementById('resetBtn');
    const presetBtns = document.querySelectorAll('.preset-btn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const mascot = document.getElementById('mascot');

    // 設定彈窗相關元素
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalX = document.getElementById('closeModalX');
    const customModal = document.getElementById('customModal');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const saveModalBtn = document.getElementById('saveModalBtn');
    const inputHours = document.getElementById('inputHours');
    const inputMinutes = document.getElementById('inputMinutes');
    const inputSeconds = document.getElementById('inputSeconds');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundIcon = document.getElementById('soundIcon');
    const soundText = document.getElementById('soundText');
    const themeOptionBtns = document.querySelectorAll('.theme-option-btn');

    const finishModal = document.getElementById('finishModal');
    const closeFinishBtn = document.getElementById('closeFinishBtn');

    // --- Web Audio 柔和音樂音效合成器 ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTickSound() {
      if (!isSoundEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(660, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(330, audioCtx.currentTime + 0.05);

        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    function playFanfareSound() {
      if (!isSoundEnabled) return;
      try {
        initAudio();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.12);

          gain.gain.setValueAtTime(0, audioCtx.currentTime + idx * 0.12);
          gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + idx * 0.12 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.12 + 0.5);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.12);
          osc.stop(audioCtx.currentTime + idx * 0.12 + 0.55);
        });
      } catch (e) {}
    }

    // --- 時間格式化與顯示更新 ---
    function formatTime(secs) {
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = secs % 60;
      const pad = (n) => String(n).padStart(2, '0');

      if (h > 0) {
        return `${pad(h)}:${pad(m)}:${pad(s)}`;
      }
      return `${pad(m)}:${pad(s)}`;
    }

    function updateDisplay() {
      const formatted = formatTime(remainingSeconds);
      timerText.textContent = formatted;
      document.title = `${formatted} - 航海王倒數計時器`;

      const progressPercent = totalSeconds > 0 ? (remainingSeconds / totalSeconds) * 100 : 0;
      progressBar.style.width = `${progressPercent}%`;
    }

    // --- 計時核心控制 ---
    function startTimer() {
      if (remainingSeconds <= 0) return;
      initAudio();
      isRunning = true;
      startBtn.classList.replace('from-amber-500', 'from-amber-600');
      startBtn.classList.replace('to-yellow-500', 'to-rose-600');
      startIcon.textContent = '⏸';
      startText.textContent = '暫停航行';

      timerId = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();
          if (remainingSeconds <= 3 && remainingSeconds > 0) {
            playTickSound();
          }
        } else {
          finishTimer();
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerId);
      timerId = null;
      startBtn.classList.replace('from-amber-600', 'from-amber-500');
      startBtn.classList.replace('to-rose-600', 'to-yellow-500');
      startIcon.textContent = '▶';
      startText.textContent = '繼續出發';
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = totalSeconds;
      startIcon.textContent = '▶';
      startText.textContent = '起航出發';
      updateDisplay();
    }

    function finishTimer() {
      pauseTimer();
      remainingSeconds = 0;
      updateDisplay();
      playFanfareSound();
      triggerConfetti();
      showModal(finishModal);
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 90,
          spread: 80,
          origin: { y: 0.65 },
          colors: ['#f59e0b', '#3b82f6', '#ef4444', '#10b981', '#ffffff']
        });
      }
    }

    function showModal(modal) {
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modal.querySelector('div').classList.remove('scale-95');
        modal.querySelector('div').classList.add('scale-100');
      }, 10);
    }

    function hideModal(modal) {
      modal.classList.add('opacity-0');
      modal.querySelector('div').classList.remove('scale-100');
      modal.querySelector('div').classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 200);
    }

    // --- 風格切換邏輯 ---
    function setTheme(themeName) {
      currentTheme = themeName;
      document.body.className = `${themeName} min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 relative overflow-x-hidden`;
      
      themeOptionBtns.forEach(btn => {
        if (btn.getAttribute('data-theme') === themeName) {
          btn.classList.add('border-amber-400');
          btn.classList.remove('border-transparent');
        } else {
          btn.classList.remove('border-amber-400');
          btn.classList.add('border-transparent');
        }
      });
    }

    // --- 事件監聽器 ---
    startBtn.addEventListener('click', () => {
      if (isRunning) {
        pauseTimer();
      } else {
        if (remainingSeconds <= 0) {
          remainingSeconds = totalSeconds;
        }
        startTimer();
      }
    });

    resetBtn.addEventListener('click', resetTimer);

    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const secs = parseInt(btn.getAttribute('data-sec'), 10);
        totalSeconds = secs;
        resetTimer();
      });
    });

    mascot.addEventListener('click', () => {
      initAudio();
      mascot.style.transform = 'scale(0.85) rotate(-15deg)';
      setTimeout(() => {
        mascot.style.transform = 'scale(1.15) rotate(15deg)';
        setTimeout(() => {
          mascot.style.transform = '';
        }, 150);
      }, 100);
      playTickSound();
    });

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    // 齒輪設定按鈕開關
    openModalBtn.addEventListener('click', () => {
      const h = Math.floor(remainingSeconds / 3600);
      const m = Math.floor((remainingSeconds % 3600) / 60);
      const s = remainingSeconds % 60;
      inputHours.value = h;
      inputMinutes.value = m;
      inputSeconds.value = s;
      showModal(customModal);
    });

    closeModalX.addEventListener('click', () => hideModal(customModal));
    cancelModalBtn.addEventListener('click', () => hideModal(customModal));

    // 音效開關切換
    soundToggleBtn.addEventListener('click', () => {
      isSoundEnabled = !isSoundEnabled;
      soundIcon.textContent = isSoundEnabled ? '🔔' : '🔕';
      soundText.textContent = isSoundEnabled ? '已開啟' : '已關閉';
      soundToggleBtn.classList.toggle('opacity-70', !isSoundEnabled);
    });

    // 風格按鈕點擊
    themeOptionBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        setTheme(btn.getAttribute('data-theme'));
      });
    });

    // 儲存設定
    saveModalBtn.addEventListener('click', () => {
      const h = Math.max(0, parseInt(inputHours.value, 10) || 0);
      const m = Math.max(0, Math.min(59, parseInt(inputMinutes.value, 10) || 0));
      const s = Math.max(0, Math.min(59, parseInt(inputSeconds.value, 10) || 0));

      const calculatedSecs = (h * 3600) + (m * 60) + s;
      if (calculatedSecs > 0) {
        totalSeconds = calculatedSecs;
        hideModal(customModal);
        resetTimer();
      } else {
        inputMinutes.focus();
      }
    });

    closeFinishBtn.addEventListener('click', () => {
      hideModal(finishModal);
      resetTimer();
    });

    customModal.addEventListener('click', (e) => {
      if (e.target === customModal) hideModal(customModal);
    });
    finishModal.addEventListener('click', (e) => {
      if (e.target === finishModal) {
        hideModal(finishModal);
        resetTimer();
      }
    });

    updateDisplay();
  </script>
</body>
</html>
